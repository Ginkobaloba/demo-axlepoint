# The demo reset schedule, as code.
#
# THIS IS A FRAGMENT, NOT A STACK. It is merged into the edge compose project
# at deploy time. It deliberately does NOT live in cloudflare-config/edge:
# recreating an edge container is a production change, and adding a service to
# that stack is the deployer's call, made with the usual care, not something
# this repo does to it from a distance.
#
#   docker compose -f edge/docker-compose.yml \
#                  -f edge/docker-compose.prod.yml \
#                  -f <this file> up -d --no-deps axlepoint-reset
#
# WHY A SIDECAR RATHER THAN A WINDOWS SCHEDULED TASK. A scheduled task lives on
# one machine and is invisible to the repository: it cannot be reviewed, it is
# not deployed with the thing it resets, and it is silently orphaned the day
# the demo moves to Workers. This travels with the stack, is versioned, and its
# absence is visible in a compose file rather than only in Task Scheduler.
#
# WHAT IT IS NOT. A `while true; sleep` loop is not a real scheduler: it drifts,
# and a restart resets the phase. That is acceptable for a 6-hour retention
# window and it is NOT the guarantee. The guarantee is `npm run check:reset`,
# which reads ops.reset_log and fails if the last successful reset is too old.
# Believe the check, not the fact that a container is running.

services:
  axlepoint-reset:
    # A PREBUILT IMAGE, NOT A BUILD. This said `build: {context: ../.., target:
    # reset}` until 2026-10-01, which does not work for the invocation documented
    # below and failed dangerously rather than cleanly.
    #
    # Compose resolves `build.context` relative to the PROJECT DIRECTORY -- the
    # directory of the FIRST `-f` file -- not relative to the fragment that
    # declares it. Merged into the edge stack as intended, `../..` therefore
    # resolved to C:\dev, not to this repository, and the build read
    # C:\dev\Dockerfile.
    #
    # It failed with "the Dockerfile cannot be empty" only because that stray
    # file happens to be 0 bytes. Had it contained anything valid, compose would
    # have built a COMPLETELY DIFFERENT image and run it here -- as the process
    # holding the demo_reset database credential, whose DELETE carries no WHERE
    # clause. The empty file is the only reason this was loud.
    #
    # So compose no longer builds, matching every other edge service: the image
    # is built deliberately, with a context named explicitly, and compose just
    # runs it. Build it with (one line, from anywhere):
    #
    #   docker build --target reset --secret id=npmrc,src=<npmrc> \
    #     -t demo-axlepoint-reset:latest C:\dev\demo-axlepoint
    #
    # The npmrc secret is needed because @paradigm-codes/auth comes from GitHub
    # Packages; scripts/deploy-demo.ps1 shows how that file is produced and why
    # it is written without a BOM. See docs/ops/DEPLOY_POSTGRES.md.
    image: demo-axlepoint-reset:latest
    # Never reach for Docker Hub: this image is local-only and a pull would
    # fail confusingly rather than telling you the build step was skipped.
    pull_policy: never
    container_name: axlepoint-reset
    restart: always
    environment:
      # Six hours. Lower it to watch the thing work; do not raise it without
      # changing RESET_MAX_AGE_HOURS in the deploy check too, or the check will
      # start failing for a reason that is not a fault.
      RESET_INTERVAL_SECONDS: "21600"
      AXLEPOINT_SEED_TENANT: "sample"
    env_file:
      # MUST contain DATABASE_URL (the demo_reset credential, NOT the app's and
      # never a superuser -- the reset refuses a role that bypasses RLS) and an
      # alert destination: either RESET_ALERT_WEBHOOK, or
      # RESET_ALERT_SLACK_TOKEN with RESET_ALERT_SLACK_CHANNEL. The script
      # refuses to start without one, because a reset that fails silently is
      # worse than one that does not run. See src/lib/reset-alert.ts.
      #
      # NOT `./axlepoint-reset.env`, which is what this file said until
      # 2026-10-01 and is actively unsafe on the deploy host. Two reasons, both
      # checked rather than assumed:
      #   1. `.gitignore` matches `.env*.local`, which does NOT match
      #      `axlepoint-reset.env` -- `git check-ignore` confirmed the path was
      #      not ignored, so the credential was one `git add -A` from being
      #      committed.
      #   2. Google Drive for desktop two-way mirrors C:\dev. Anything secret
      #      under this tree is uploaded, and a Drive copy outlives a local
      #      delete by sitting in Drive Trash.
      # So it lives beside the other demo credentials, outside the repository
      # and outside the mirrored tree, using the same indirection the edge
      # compose already uses for demo_env_axlepoint.local.txt.
      - ${EDGE_SECRETS_DIR:-C:/Users/Drama/.secrets}/axlepoint_reset.local.txt
    depends_on:
      - demo-axlepoint

# No top-level `secrets:` block any more. It existed only to feed the npmrc into
# a `build:` that this fragment no longer performs, and its default of /dev/null
# was never a real path on the deploy host anyway.
