# smoke.yml -- fast surface checks run on every PR
#
# Supported assertion types:
#   http_status       -- checks HTTP response code matches `expect`
#   text_present      -- checks that `text` appears in the response body
#   selector_present  -- checks that a CSS selector matches at least one element
#   header_present    -- checks that the named response header exists
#   redirects_to      -- checks that the URL redirects to `expect` (final URL)
#   json_path_equals  -- checks that a JSONPath expression equals `expect`

target: demo-axlepoint
deploy_url: https://axlepoint.projectnexuscode.org

surfaces:
  - name: home
    url: /
    assertions:
      - { type: http_status, expect: 200 }
      - { type: text_present, text: "Asset health and maintenance operations for" }
      - { type: text_present, text: "AxlePoint" }
      - { type: text_present, text: "Open the live demo" }
      - { type: header_present, header: "Strict-Transport-Security" }
      - { type: selector_present, selector: "form[action='/api/session']" }

  # Everything under /app is gated. Quick smoke is one anonymous curl with no
  # cookie jar, so the only contract it can honestly assert here is that the
  # gate is CLOSED: each route bounces to the sign-in page and the landing
  # page really is the sign-in form. The authenticated views (the dashboard
  # copy, the asset table, the work-order form) need a real session and a
  # browser, so they are deep-verify surfaces, not quick ones.
  #
  # This block used to assert the authenticated copy on an anonymous request
  # while ALSO asserting, at the bottom of the file, that an anonymous request
  # is redirected away. Both cannot hold in one run, so the gate failed on
  # every PR precisely because the app was behaving correctly.
  - name: dashboard-gated
    url: /app
    assertions:
      - { type: redirects_to, expect: "/?signin=required" }
      - { type: http_status, expect: 200 }
      - { type: text_present, text: "Sign in" }
      - { type: header_present, header: "Strict-Transport-Security" }

  - name: assets-gated
    url: /app/assets
    assertions:
      - { type: redirects_to, expect: "/?signin=required" }
      - { type: header_present, header: "Strict-Transport-Security" }

  - name: work-orders-gated
    url: /app/work-orders
    assertions:
      - { type: redirects_to, expect: "/?signin=required" }
      - { type: header_present, header: "Strict-Transport-Security" }

  # /api/session is the sign-in handler and accepts POST only. quick_smoke.sh
  # issues a GET, so 405 is the correct expectation and a real one: a 404 here
  # would mean the route had gone, and a 2xx/3xx would mean it started
  # answering GETs. This matches demo-slatewell's admin-session-post surface.
  # The POST that actually signs a user in is a deep-verify step.
  - name: session-signin-rejects-get
    url: /api/session
    assertions:
      - { type: http_status, expect: 405 }
